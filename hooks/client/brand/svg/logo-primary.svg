<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C872"/>
      <stop offset="50%" stop-color="#D4A84B"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="darkGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0D78C"/>
      <stop offset="100%" stop-color="#A67C00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background subtle for preview (transparent in real use) -->
  <!-- Mark: Gothic film-strip / stake hybrid -->
  <g transform="translate(20, 30)">
    <!-- Outer gothic frame -->
    <path d="M10 10 L50 10 L55 20 L55 120 L50 130 L10 130 L5 120 L5 20 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- Film strip perforations left -->
    <rect x="12" y="25" width="8" height="6" rx="1" fill="url(#goldGrad)"/>
    <rect x="12" y="40" width="8" height="6" rx="1" fill="url(#goldGrad)"/>
    <rect x="12" y="55" width="8" height="6" rx="1" fill="url(#goldGrad)"/>
    <rect x="12" y="70" width="8" height="6" rx="1" fill="url(#goldGrad)"/>
    <rect x="12" y="85" width="8" height="6" rx="1" fill="url(#goldGrad)"/>
    <rect x="12" y="100" width="8" height="6" rx="1" fill="url(#goldGrad)"/>
    
    <!-- Film strip perforations right -->
    <rect x="40" y="25" width="8" height="6" rx="1" fill="url(#goldGrad)"/>
    <rect x="40" y="40" width="8" height="6" rx="1" fill="url(#goldGrad)"/>
    <rect x="40" y="55" width="8" height="6" rx="1" fill="url(#goldGrad)"/>
    <rect x="40" y="70" width="8" height="6" rx="1" fill="url(#goldGrad)"/>
    <rect x="40" y="85" width="8" height="6" rx="1" fill="url(#goldGrad)"/>
    <rect x="40" y="100" width="8" height="6" rx="1" fill="url(#goldGrad)"/>
    
    <!-- Central stake / cross -->
    <rect x="27" y="30" width="6" height="80" rx="1" fill="url(#darkGold)"/>
    <rect x="18" y="48" width="24" height="6" rx="1" fill="url(#darkGold)"/>
    
    <!-- Small diamond accent at top of stake -->
    <path d="M30 22 L34 30 L30 38 L26 30 Z" fill="url(#goldGrad)"/>
  </g>
  
  <!-- Wordmark -->
  <text x="95" y="85" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="600" 
        fill="url(#goldGrad)" letter-spacing="1.5">Flashback</text>
  <text x="95" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="400" 
        fill="#E8C872" letter-spacing="3">Repository</text>
  
  <!-- Tagline -->
  <text x="95" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12" 
        fill="#A89060" letter-spacing="1.2">OWN THE ORIGINAL  ·  THEN IMPROVE IT</text>
</svg>
