themes:
  dark:
    variables:
      house: "#0d0505"
      velvet: "#3a1018"
      velvetDeep: "#1a080c"
      gold: "#e8c872"
      goldMid: "#d4a84b"
      goldDim: "#b8860b"
      cream: "#f5e6be"
      creamMuted: "#c4b49a"
      screen: "#1c1410"
      border: "#4a3028"
      warn: "#c45c4a"
      ok: "#6a9a6a"
    breakpoints:
      sm: "640px"
      md: "900px"
      lg: "1100px"
    selectors:
      body:
        margin: "0"
        minHeight: "100%"
        overflowX: "clip"
        overflowY: "auto"
        backgroundColor: "var(house)"
        color: "var(cream)"
        fontFamily: "Georgia, 'Times New Roman', Times, serif"
        lineHeight: "1.55"
      # Bare <a> (markdown prose, etc.) — descendant selectors are not emitted by the styler.
      a:
        color: "var(gold)"
        textDecoration: "none"
      "a:visited":
        color: "var(gold)"
        textDecoration: "none"
      "a:hover":
        color: "var(cream)"
        textDecoration: "underline"
      ".fb-app":
        position: "relative"
        minHeight: "100%"
        display: "flex"
        flexDirection: "column"
        color: "var(cream)"
        backgroundColor: "var(house)"
        # clip (not hidden) so sticky header can stick to the viewport
        overflowX: "clip"
        overflowY: "visible"
      ".fb-backdrop":
        position: "fixed"
        inset: "0"
        zIndex: "0"
        pointerEvents: "none"
        backgroundColor: "var(house)"
        # Default velvet desktop cover; swapped at breakpoints / theme toggle
        backgroundImage: "url(/hooks/client/brand/jpg/velvet/theater-bg-desktop.jpg)"
        backgroundRepeat: "no-repeat"
        backgroundPosition: "center center"
        backgroundSize: "cover"
      ".fb-curtain":
        display: "none"
      # Sconce columns retired — lighting is baked into theater-bg-*.jpg
      ".fb-wall-lights":
        display: "none"
      ".fb-wall-lights-left":
        display: "none"
      ".fb-wall-lights-right":
        display: "none"
      ".fb-screen-glow":
        position: "absolute"
        left: "50%"
        top: "12%"
        width: "56%"
        height: "28%"
        transform: "translateX(-50%)"
        background: "radial-gradient(ellipse at center, rgba(212,165,116,0.12) 0%, transparent 70%)"
        opacity: "0.75"
      ".fb-header":
        position: "sticky"
        top: "0"
        zIndex: "40"
        display: "flex"
        flexDirection: "row"
        flexWrap: "wrap"
        alignItems: "center"
        justifyContent: "space-between"
        gap: "12px"
        padding: "16px 20px"
        borderBottom: "1px solid var(border)"
        background: "linear-gradient(180deg, #1a0a0c 0%, #120608 100%)"
        boxShadow: "0 8px 24px rgba(0,0,0,0.45)"
      ".fb-brand":
        display: "flex"
        flexDirection: "row"
        alignItems: "center"
        gap: "12px"
        color: "var(gold)"
        textDecoration: "none"
        minWidth: "0"
      # Beat global a:hover underline (brand is a home link).
      ".fb-brand:hover":
        color: "var(gold)"
        textDecoration: "none"
      ".fb-brand:focus":
        color: "var(gold)"
        textDecoration: "none"
      # Keyboard focus ring (UA default is hard to see on dark theater UI)
      "a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .fb-btn:focus-visible, .fb-slideshow-nav:focus-visible, .fb-chat-chan:focus-visible, .fb-theme-toggle:focus-visible":
        outline: "2px solid var(gold)"
        outlineOffset: "3px"
      ".fb-gate-error":
        margin: "0 0 10px"
        fontSize: "0.9rem"
        color: "var(warn)"
      ".fb-brand-logo":
        display: "block"
        height: "56px"
        width: "auto"
        maxWidth: "420px"
        flexShrink: "0"
        borderRadius: "0"
        objectFit: "contain"
      ".fb-brand-mark":
        display: "block"
        height: "28px"
        width: "28px"
        flexShrink: "0"
        objectFit: "contain"
      ".fb-footer-brand":
        display: "inline-flex"
        flexDirection: "row"
        alignItems: "center"
        gap: "8px"
        color: "var(gold)"
      ".fb-nav":
        display: "flex"
        flexDirection: "row"
        flexWrap: "wrap"
        alignItems: "center"
        gap: "16px"
        fontSize: "0.95rem"
      ".fb-nav-drop":
        position: "relative"
      ".fb-nav-sum":
        cursor: "pointer"
        listStyle: "none"
      ".fb-nav-panel":
        position: "absolute"
        top: "calc(100% + 8px)"
        right: "0"
        zIndex: "50"
        display: "flex"
        flexDirection: "column"
        alignItems: "flex-start"
        gap: "10px"
        minWidth: "9rem"
        padding: "12px 14px"
        background: "linear-gradient(180deg, #1a0a0c 0%, #120608 100%)"
        border: "1px solid var(border)"
        boxShadow: "0 12px 28px rgba(0,0,0,0.55)"
      # Class on the <a> itself — descendant selectors like `.fb-nav a` are not emitted.
      ".fb-link":
        color: "var(gold)"
        textDecoration: "none"
        letterSpacing: "0.02em"
      ".fb-link:visited":
        color: "var(gold)"
        textDecoration: "none"
      ".fb-link:hover":
        color: "var(cream)"
        textDecoration: "underline"
      ".fb-lobby":
        display: "flex"
        flexDirection: "column"
        alignItems: "stretch"
        gap: "10px"
        color: "var(gold)"
      ".fb-lobby-field":
        display: "inline-flex"
        flexDirection: "row"
        alignItems: "center"
        gap: "4px"
        fontSize: "0.85rem"
        color: "var(gold)"
      ".fb-lobby-playlist":
        background: "#1a0c10"
        color: "var(cream)"
        border: "1px solid var(goldDim)"
        fontFamily: "inherit"
        fontSize: "0.85rem"
        padding: "2px 4px"
      ".fb-lobby-volume":
        width: "72px"
        accentColor: "var(gold)"
      ".fb-marquee":
        position: "relative"
        zIndex: "2"
        display: "flex"
        flexDirection: "row"
        alignItems: "center"
        justifyContent: "center"
        gap: "8px"
        padding: "7px 12px"
        background: "linear-gradient(180deg, #14100a 0%, #0a0806 55%, #100c08 100%)"
        borderBottom: "1px solid var(border)"
        boxShadow: "inset 0 0 18px rgba(0,0,0,0.7)"
        fontFamily: "ui-monospace, 'Courier New', Courier, monospace"
        color: "var(gold)"
      ".fb-marquee-lights":
        display: "flex"
        flexDirection: "row"
        flexShrink: "0"
        alignItems: "center"
        gap: "3px"
        color: "var(gold)"
      ".fb-marquee-wing":
        maxWidth: "28%"
        overflow: "hidden"
      ".fb-wing-letter":
        display: "inline-block"
        fontSize: "0.62rem"
        letterSpacing: "0.08em"
        textTransform: "lowercase"
        color: "var(gold)"
        textShadow: "0 0 6px rgba(212,165,116,0.55)"
        lineHeight: "1"
        padding: "0 1px"
      ".fb-wing-gap":
        display: "inline-block"
        width: "4px"
      ".fb-bulb":
        opacity: "0.55"
        flexShrink: "0"
      ".fb-bulb-0":
        opacity: "0.95"
      ".fb-bulb-2":
        opacity: "0.75"
      ".fb-marquee-board":
        flex: "1"
        minWidth: "0"
        display: "flex"
        flexDirection: "row"
        alignItems: "center"
        maxWidth: "720px"
      ".fb-lcd":
        flex: "1"
        minWidth: "0"
        display: "flex"
        flexDirection: "row"
        alignItems: "center"
        padding: "2px 0"
        background: "transparent"
        border: "none"
        boxShadow: "none"
        fontFamily: "inherit"
        color: "inherit"
      ".fb-lcd-window":
        flex: "1"
        minWidth: "0"
        overflow: "hidden"
        whiteSpace: "nowrap"
        maskImage: "linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent)"
      ".fb-lcd-track":
        display: "inline-block"
        whiteSpace: "nowrap"
        fontSize: "0.78rem"
        letterSpacing: "0.04em"
        lineHeight: "1.35"
      ".fb-lcd-link":
        color: "var(gold)"
        textDecoration: "none"
        textShadow: "0 0 5px rgba(212,165,116,0.35)"
      ".fb-lcd-link:hover":
        color: "var(cream)"
        textDecoration: "underline"
      ".fb-lcd-star":
        opacity: "0.9"
        textShadow: "0 0 6px rgba(212,165,116,0.35)"
      ".fb-marquee-text":
        margin: "0"
        fontSize: "0.8rem"
        letterSpacing: "0.12em"
        textTransform: "uppercase"
        color: "var(gold)"
      ".fb-main":
        position: "relative"
        zIndex: "2"
        flex: "1"
        padding: "20px 18px 40px"
        maxWidth: "960px"
        width: "100%"
        marginLeft: "auto"
        marginRight: "auto"
        boxSizing: "border-box"
        # Opaque enough for cream copy; slight transparency keeps theater texture
        background: "rgba(13,5,5,0.9)"
        borderRadius: "2px"
      # Chat page: stay in article column; clear space above site footer
      ".fb-main-chat":
        paddingBottom: "28px"
      ".fb-chat-page":
        width: "100%"
      ".fb-chat-page .fb-movie-blurb":
        marginBottom: "10px"
      ".fb-chat-page .fb-chat-app-host":
        display: "block"
        width: "100%"
        marginBottom: "12px"
      ".fb-chat-page .fb-chat-app":
        width: "100%"
        minHeight: "min(62vh, 640px)"
      ".fb-affirmation":
        padding: "20px 18px 8px"
        boxSizing: "border-box"
      ".fb-footer":
        position: "relative"
        zIndex: "2"
        display: "flex"
        flexDirection: "row"
        flexWrap: "wrap"
        justifyContent: "space-between"
        alignItems: "center"
        gap: "8px"
        padding: "14px 20px"
        borderTop: "1px solid var(border)"
        background: "rgba(10,7,8,0.9)"
        fontSize: "0.82rem"
        color: "var(creamMuted)"
      ".fb-footer-hits":
        color: "var(creamMuted)"
        fontSize: "0.78rem"
        letterSpacing: "0.04em"
      ".fb-movie-hits":
        flex: "0 0 auto"
        margin: "8px 0 0"
        paddingTop: "8px"
        borderTop: "1px solid var(border)"
        color: "var(creamMuted)"
        fontSize: "0.85rem"
        letterSpacing: "0.03em"
      ".fb-section-title":
        marginTop: "28px"
        marginBottom: "12px"
        fontSize: "1.15rem"
        color: "var(gold)"
        letterSpacing: "0.06em"
        textTransform: "uppercase"
      ".fb-title-grid":
        display: "flex"
        flexDirection: "column"
        gap: "10px"
      ".fb-title-card":
        display: "flex"
        flexDirection: "row"
        alignItems: "flex-start"
        gap: "12px"
        width: "100%"
        textAlign: "left"
        textDecoration: "none"
        padding: "14px 16px"
        background: "linear-gradient(135deg, rgba(42,24,16,0.9), rgba(18,10,12,0.95))"
        border: "1px solid var(border)"
        borderRadius: "2px"
        color: "var(cream)"
        cursor: "pointer"
        fontFamily: "inherit"
        boxSizing: "border-box"
      ".fb-title-card:hover":
        borderColor: "var(goldDim)"
        transform: "translateY(-1px)"
      ".fb-title-card-mark":
        color: "var(gold)"
        flexShrink: "0"
        marginTop: "2px"
      ".fb-title-card-body":
        display: "flex"
        flexDirection: "column"
        gap: "4px"
        minWidth: "0"
      ".fb-title-card-name":
        fontSize: "1.05rem"
        fontWeight: "700"
      ".fb-title-card-blurb":
        fontSize: "0.88rem"
        color: "var(creamMuted)"
        lineHeight: "1.4"
      ".fb-title-card-meta":
        fontSize: "0.72rem"
        letterSpacing: "0.08em"
        textTransform: "uppercase"
        color: "var(goldDim)"
      ".fb-status-ready .fb-title-card-meta":
        color: "var(ok)"
      ".fb-status-showing .fb-title-card-meta":
        color: "var(ok)"
      ".fb-status-coming_soon .fb-title-card-meta":
        color: "var(creamMuted)"
      ".fb-status-needs-seed .fb-title-card-meta":
        color: "var(warn)"
      ".fb-home-lead":
        display: "flex"
        flexDirection: "column"
        gap: "20px"
        marginTop: "4px"
        marginBottom: "12px"
      ".fb-home-intro":
        minWidth: "0"
      ".fb-home-intro a":
        color: "var(gold)"
      ".fb-home-blog":
        minWidth: "0"
        padding: "14px 16px 16px"
        background: "linear-gradient(160deg, rgba(42,18,22,0.92), rgba(14,8,10,0.96))"
        border: "1px solid var(border)"
      ".fb-home-blog .fb-section-title":
        marginTop: "0"
      ".fb-now-showing":
        marginTop: "0"
        marginBottom: "28px"
      ".fb-now-showing-head":
        display: "flex"
        flexDirection: "row"
        alignItems: "baseline"
        justifyContent: "space-between"
        gap: "12px"
        marginBottom: "10px"
      ".fb-now-showing-title":
        marginTop: "0"
        marginBottom: "0"
      ".fb-now-showing-count":
        margin: "0"
        fontSize: "0.78rem"
        letterSpacing: "0.12em"
        textTransform: "uppercase"
        color: "var(goldDim)"
      ".fb-slideshow":
        position: "relative"
        display: "flex"
        flexDirection: "row"
        alignItems: "stretch"
        gap: "8px"
      ".fb-slide-nav":
        flexShrink: "0"
        width: "42px"
        alignSelf: "stretch"
        border: "1px solid var(goldDim)"
        background: "linear-gradient(180deg, rgba(58,16,24,0.95), rgba(18,8,10,0.98))"
        color: "var(gold)"
        fontSize: "1.8rem"
        lineHeight: "1"
        cursor: "pointer"
        fontFamily: "inherit"
        borderRadius: "2px"
      ".fb-slide-nav:hover":
        borderColor: "var(gold)"
        color: "var(cream)"
      ".fb-slide":
        flex: "1"
        minWidth: "0"
        display: "flex"
        flexDirection: "row"
        alignItems: "stretch"
        gap: "0"
        textDecoration: "none"
        color: "var(cream)"
        border: "1px solid var(goldDim)"
        borderRadius: "2px"
        overflow: "hidden"
        background: "linear-gradient(145deg, #2a1418 0%, #12080a 55%, #0d0505 100%)"
        boxShadow: "0 12px 36px rgba(0,0,0,0.45)"
        minHeight: "220px"
      ".fb-slide:hover":
        borderColor: "var(gold)"
      ".fb-slide-art":
        flex: "0 0 42%"
        maxWidth: "280px"
        background: "#0d0505"
        display: "flex"
        alignItems: "center"
        justifyContent: "center"
        overflow: "hidden"
      ".fb-slide-img":
        display: "block"
        width: "100%"
        height: "100%"
        objectFit: "cover"
      ".fb-slide-copy":
        flex: "1"
        minWidth: "0"
        padding: "22px 20px 20px"
        display: "flex"
        flexDirection: "column"
        gap: "8px"
        justifyContent: "center"
      ".fb-slide-text .fb-slide-copy":
        padding: "28px 24px"
      ".fb-slide-kicker":
        margin: "0"
        fontSize: "0.72rem"
        letterSpacing: "0.16em"
        textTransform: "uppercase"
        color: "var(gold)"
      ".fb-slide-name":
        margin: "0"
        fontSize: "1.35rem"
        lineHeight: "1.25"
        color: "var(cream)"
      ".fb-slide-blurb":
        margin: "0"
        fontSize: "0.95rem"
        lineHeight: "1.5"
        color: "var(creamMuted)"
      ".fb-slide-meta":
        margin: "8px 0 0"
        fontSize: "0.72rem"
        letterSpacing: "0.1em"
        textTransform: "uppercase"
        color: "var(goldDim)"
      ".fb-slide-meta.fb-status-ready":
        color: "var(ok)"
      ".fb-blog-empty":
        color: "var(creamMuted)"
        margin: "0"
      ".fb-blog-post":
        marginTop: "4px"
      ".fb-blog-post + .fb-blog-post":
        marginTop: "22px"
        paddingTop: "18px"
        borderTop: "1px solid var(border)"
      ".fb-blog-date":
        margin: "0 0 4px"
        fontSize: "0.72rem"
        letterSpacing: "0.08em"
        textTransform: "uppercase"
        color: "var(goldDim)"
      ".fb-blog-title":
        margin: "0 0 10px"
        fontSize: "1.2rem"
        color: "var(cream)"
        lineHeight: "1.35"
      ".fb-blog-body":
        color: "var(creamMuted)"
        fontSize: "0.95rem"
      ".fb-blog-body a":
        color: "var(gold)"
      ".fb-blog-body p":
        margin: "0 0 0.85em"
      ".fb-blog-body ul":
        margin: "0 0 0.85em"
        paddingLeft: "1.2em"
      ".fb-main-movie":
        maxWidth: "1180px"
      ".fb-movie":
        display: "flex"
        flexDirection: "column"
      ".fb-movie-title":
        margin: "0 0 10px"
        fontSize: "1.75rem"
        color: "var(cream)"
      ".fb-movie-hero":
        display: "grid"
        # Cap the poster column so a tall window cannot crush the notes.
        gridTemplateColumns: "minmax(180px, 42%) minmax(0, 1fr)"
        alignItems: "stretch"
        gap: "18px"
        height: "calc(100dvh - 11.5rem)"
        minHeight: "420px"
        marginBottom: "8px"
      ".fb-movie-art":
        display: "flex"
        flexDirection: "column"
        alignItems: "center"
        height: "100%"
        minHeight: "0"
        minWidth: "0"
        overflow: "visible"
      ".fb-poster-stack":
        display: "flex"
        flexDirection: "column"
        alignItems: "stretch"
        height: "100%"
        maxWidth: "100%"
        minHeight: "0"
        width: "fit-content"
        gap: "8px"
      ".fb-movie-chat":
        order: "3"
        marginTop: "18px"
      ".fb-movie-blurb":
        color: "var(creamMuted)"
        marginBottom: "12px"
      ".fb-movie-poster":
        display: "block"
        width: "auto"
        height: "auto"
        maxWidth: "100%"
        maxHeight: "calc(100% - 56px)"
        objectFit: "contain"
        objectPosition: "center center"
        margin: "0"
        border: "1px solid var(border)"
        background: "var(screen)"
        cursor: "zoom-in"
      ".fb-watch-cta":
        display: "flex"
        flex: "0 0 auto"
        width: "100%"
        boxSizing: "border-box"
        minHeight: "48px"
        alignItems: "center"
        justifyContent: "center"
        fontSize: "1.15rem"
      ".fb-movie-notes":
        display: "flex"
        flexDirection: "column"
        minWidth: "0"
        minHeight: "0"
        height: "100%"
        overflow: "hidden"
      ".fb-movie-notes-scroll":
        flex: "1 1 auto"
        minHeight: "0"
        overflowX: "hidden"
        overflowY: "auto"
        overscrollBehavior: "auto"
        WebkitOverflowScrolling: "touch"
        paddingRight: "6px"
      ".fb-watch-toggle":
        position: "absolute"
        width: "1px"
        height: "1px"
        padding: "0"
        margin: "-1px"
        overflow: "hidden"
        clip: "rect(0, 0, 0, 0)"
        border: "0"
      ".fb-watch-scrim":
        display: "none"
        position: "fixed"
        inset: "0"
        zIndex: "80"
        alignItems: "center"
        justifyContent: "center"
        padding: "22px"
        background: "rgba(6,4,5,0.9)"
        boxSizing: "border-box"
      ".fb-watch-toggle:checked ~ .fb-watch-scrim":
        display: "flex"
      ".fb-watch-backdrop":
        position: "absolute"
        inset: "0"
        cursor: "pointer"
      ".fb-watch-dialog":
        position: "relative"
        zIndex: "1"
        width: "min(640px, 100%)"
        maxHeight: "85vh"
        overflowY: "auto"
        padding: "16px 16px 8px"
        background: "linear-gradient(165deg, #3a1820 0%, #1a0c10 55%, #12080a 100%)"
        border: "1px solid var(gold)"
        boxShadow: "0 24px 70px rgba(0,0,0,0.6)"
        boxSizing: "border-box"
      ".fb-watch-close":
        display: "block"
        width: "auto"
        margin: "0 0 10px auto"
        cursor: "pointer"
      ".fb-video-panel":
        position: "relative"
        flex: "1 1 auto"
        minWidth: "0"
        marginBottom: "0"
        padding: "0"
        background: "transparent"
        border: "none"
        order: "2"
      ".fb-movie-nomedia":
        order: "2"
        margin: "8px 0 0"
        color: "var(creamMuted)"
        fontSize: "0.92rem"
      ".fb-movie-files":
        order: "5"
        marginTop: "18px"
        paddingTop: "16px"
        borderTop: "1px solid var(border)"
      ".fb-files-lead":
        margin: "0 0 12px"
        color: "var(creamMuted)"
        fontSize: "0.95rem"
        lineHeight: "1.5"
      ".fb-files-lead a":
        color: "var(gold)"
      ".fb-files-empty":
        margin: "0"
        color: "var(creamMuted)"
        fontSize: "0.92rem"
      ".fb-files-empty a":
        color: "var(gold)"
      ".fb-file-list":
        listStyle: "none"
        margin: "0"
        padding: "0"
        display: "flex"
        flexDirection: "column"
        gap: "6px"
      ".fb-file-row":
        display: "flex"
        flexDirection: "row"
        flexWrap: "wrap"
        alignItems: "baseline"
        gap: "8px 12px"
        padding: "8px 10px"
        background: "rgba(0,0,0,0.22)"
        border: "1px solid var(border)"
      ".fb-file-kind":
        flex: "0 0 auto"
        minWidth: "5.5rem"
        fontSize: "0.72rem"
        letterSpacing: "0.08em"
        textTransform: "uppercase"
        color: "var(goldDim)"
      ".fb-file-link":
        flex: "1 1 12rem"
        minWidth: "0"
        color: "var(gold)"
        wordBreak: "break-all"
        textDecoration: "none"
      ".fb-file-link:hover":
        color: "var(cream)"
        textDecoration: "underline"
      ".fb-file-size":
        flex: "0 0 auto"
        fontSize: "0.78rem"
        color: "var(creamMuted)"
        fontFamily: "ui-monospace, 'Courier New', monospace"
      ".fb-readme":
        marginTop: "0"
        paddingTop: "0"
        borderTop: "none"
        fontSize: "0.95rem"
        order: "3"
      ".fb-back":
        background: "transparent"
        border: "none"
        color: "var(gold)"
        fontFamily: "inherit"
